# One connection from the cluster to Vault, shared by every namespace allowed below.
# ESO logs in with its own ServiceAccount (Kubernetes auth, role "eso"):
# no Vault token is stored in the cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  # Only these namespaces may read through this store.
  conditions:
    - namespaceRegexes: ["^mycloud-(dev|qa|prod)$"]
      namespaces: ["cloudflared"]
  provider:
    vault:
      server: https://vault.mohedine.dev:8200   # Tailscale IP, Let's Encrypt cert
      path: secret                              # KV engine mount
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            # Default audience of the k3s API: Vault forwards this token to the
            # API for the TokenReview, so the API must accept it.
            audiences: ["https://kubernetes.default.svc.cluster.local"]