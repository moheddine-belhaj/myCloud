# Lets ESO's ServiceAccount ask the k3s API "is this token valid?" (TokenReview).
# Vault uses ESO's own token for that check, so no long-lived reviewer token is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-vault-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets