# Cloudflare Tunnel token, from Vault (secret/platform/cloudflared).
# One tunnel serves dev, qa and prod: the deployment reads key "token" as TUNNEL_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: cloudflared-tunnel
    # Defaults written out, so Argo CD sees no difference with the live object.
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: platform/cloudflared
        property: token