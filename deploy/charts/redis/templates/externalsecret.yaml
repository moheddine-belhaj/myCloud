{{- $path := tpl (required "vaultPath is required" .Values.vaultPath) . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "redis.name" . }}-acl
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ include "redis.name" . }}-acl
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        users.acl: |
          user default off
          user {{ .Values.aclUser.name }} on #{{ `{{ .password | sha256sum }}` }} resetkeys ~{{ .Values.aclUser.keys }} resetchannels {{ .Values.aclUser.commands }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $path }}
        property: password
