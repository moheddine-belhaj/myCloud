apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.name" . }}-config
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    bind * -::*
    port 6379
    protected-mode no
    save ""
    appendonly no
    dir /data
    maxmemory {{ .Values.maxmemory }}
    maxmemory-policy {{ .Values.maxmemoryPolicy }}
    aclfile /etc/redis/acl/users.acl
