# Defaults for every MyCloud Go service.
# Override per service in deploy/services/<service>/values.yaml
# and per environment in deploy/services/<service>/<env>/values.yaml.

environment: ""            # dev | qa | prod, set per environment

image:
  repository: ""           # e.g. ghcr.io/moheddine-belhaj/mycloud-auth
  tag: ""                  # sha-xxxxxxx, written by CI (dev) and promote.yml (qa/prod)

replicas: 1
port: 8080

# Plain, non-secret environment variables: { NAME: value }
env: {}

# Postgres connection. The Secret must be of type kubernetes.io/basic-auth
# (keys: username, password) and live in the same namespace.
database:
  enabled: false
  host: db-rw              # CNPG read/write Service of the env's cluster "db"
  name: ""                 # database name
  secret: ""               # basic-auth Secret with the role's credentials

ingress:
  enabled: false
  host: ""                 # cloud-dev.mohedine.dev, ...
  path: /                  # path prefix routed to this service

resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { memory: 128Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]