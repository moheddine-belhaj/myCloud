apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- if .Values.internalPort }}
    # Cluster-only port (no Ingress), e.g. auth's ForwardAuth endpoint for Traefik.
    - name: internal
      port: {{ .Values.internalPort }}
      targetPort: internal
    {{- end }}
