{{- /*
One ExternalSecret per entry in .Values.externalSecrets. External Secrets
Operator reads the Vault path through the ClusterSecretStore "vault" and writes
a Kubernetes Secret with the same name. Git only holds the path, never values.
*/ -}}
{{- range .Values.externalSecrets }}
{{- $name := required "externalSecrets[].name is required" .name }}
{{- $path := tpl (required (printf "externalSecrets %s: vaultPath is required" $name) .vaultPath) $ }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
  annotations:
    # Wave -1: Argo CD creates the Secret and waits for it to be synced before
    # it updates the Deployment, so pods never start without their secrets.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ $name }}
    # Defaults written out, so Argo CD sees no difference with the live object.
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range (required (printf "externalSecrets %s: keys is required" $name) .keys) }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $path }}
        property: {{ . }}
    {{- end }}
{{- end }}
