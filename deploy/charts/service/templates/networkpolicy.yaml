{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefikNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.traefikLabels | nindent 14 }}
      ports:
        - port: http
        {{- if .Values.internalPort }}
        - port: internal
        {{- end }}
{{- end }}
