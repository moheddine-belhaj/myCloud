apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mycloud-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/moheddine-belhaj/myCloud.git
        revision: main
        directories:
          - path: deploy/services/*/*          # deploy/services/<service>/<env>
  template:
    metadata:
      name: '{{ index .path.segments 2 }}-{{ .path.basename }}'    # auth-dev, auth-qa, auth-prod
    spec:
      project: mycloud
      sources:
        # 1) the shared chart
        - repoURL: https://github.com/moheddine-belhaj/myCloud.git
          targetRevision: main
          path: deploy/charts/service
          helm:
            releaseName: '{{ index .path.segments 2 }}'
            valueFiles:
              - '$values/deploy/services/{{ index .path.segments 2 }}/values.yaml'
              - '$values/{{ .path.path }}/values.yaml'
        # 2) the same repo again, only as the "$values" reference for the files above
        - repoURL: https://github.com/moheddine-belhaj/myCloud.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: 'mycloud-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true