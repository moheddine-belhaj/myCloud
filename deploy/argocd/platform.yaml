apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Shared cluster components (tunnel, later monitoring, ...)
  sourceRepos:
    - https://github.com/moheddine-belhaj/myCloud.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cloudflared
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/moheddine-belhaj/myCloud.git
    targetRevision: main
    path: deploy/platform/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true