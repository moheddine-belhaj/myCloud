# auth: values shared by all environments.
image:
  repository: ghcr.io/moheddine-belhaj/mycloud-auth

imagePullSecrets:
  - name: ghcr-pull

database:
  enabled: true
  name: auth
  secret: auth-db

ingress:
  enabled: true
  path: /api/auth
  middlewares: [strip-identity]   # no forwardauth: login and register work without a session

# M4: ForwardAuth endpoint GET /verify for Traefik, on its own port.
# In the cluster: http://auth.mycloud-<env>.svc.cluster.local:8081/verify
internalPort: 8081

# M4: auth creates the forwardauth and strip-identity Middlewares for its namespace.
forwardAuth:
  provide: true

# M3: AES-256 key that encrypts TOTP seeds, from Vault (secret/mycloud/<env>/auth-totp, key "key").
externalSecrets:
  - name: auth-totp
    vaultPath: "mycloud/{{ .Values.environment }}/auth-totp"
    keys: [key]
secretEnv:
  TOTP_KEY: { secret: auth-totp, key: key }
  
# argon2id needs ~19 MiB per hash (PR 2); allow 4 parallel hashes plus headroom.
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 256Mi }
