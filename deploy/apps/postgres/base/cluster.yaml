apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: mycloud
  annotations:
    # Deleting a Cluster deletes its PVCs = the data. Argo must never do that.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: app          # database name
      owner: app             # app user; password is generated into Secret "db-app"
  storage:
    storageClass: local-path # k3s built-in: a folder on the node's disk
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  postgresql:
    parameters:
      shared_buffers: "64MB"
      max_connections: "50"
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname