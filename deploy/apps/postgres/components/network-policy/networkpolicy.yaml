# Who may reach the CNPG pods of cluster "db" (see ../../README.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: db
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 5432
        - port: 8000
