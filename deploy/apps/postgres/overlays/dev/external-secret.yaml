# auth-db for dev, from Vault (secret/mycloud/dev/auth-db).
# Produces exactly the Secret the rest of the stack expects:
#   - CNPG DatabaseRole "auth" reads the password (and reloads it, label below)
#   - the auth Helm chart reads username + password into DATABASE_URL
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-db
spec:
  refreshInterval: 1h            # how often ESO re-reads Vault
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: auth-db
    # Defaults written out, so Argo CD sees no difference with the live object.
    creationPolicy: Owner        # ESO owns the Secret (deleted with this object)
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true" # CNPG applies a changed password to the role
  data:
    - secretKey: username
      remoteRef:
        key: mycloud/dev/auth-db
        property: username
    - secretKey: password
      remoteRef:
        key: mycloud/dev/auth-db
        property: password