# Only Traefik may reach api (M4 trust boundary, see ../../base/README.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
