apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mycloud-dev
resources:
- ../../base
labels:
- pairs:
    env: dev
images:
- name: mycloud-api
  newName: ghcr.io/moheddine-belhaj/mycloud-api
  newTag: sha-9f29790
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: cloud-dev.mohedine.dev
  target:
    kind: Ingress
    name: api
