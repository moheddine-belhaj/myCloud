apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mycloud-dev
resources:
- ../../base
components:
- ../../components/network-policy
labels:
- pairs:
    env: dev
images:
- name: mycloud-api
  newName: ghcr.io/moheddine-belhaj/mycloud-api
  newTag: sha-f24a1e7
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: cloud-dev.mohedine.dev
  target:
    kind: Ingress
    name: api
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: cloud-dev.mohedine.dev
    - op: replace
      path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
      value: mycloud-dev-strip-identity@kubernetescrd,mycloud-dev-forwardauth@kubernetescrd
  target:
    kind: Ingress
    name: api-protected
