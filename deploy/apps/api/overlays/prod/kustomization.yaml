apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mycloud-prod
resources:
- ../../base
labels:
- pairs:
    env: prod
images:
- name: mycloud-api
  newName: ghcr.io/moheddine-belhaj/mycloud-api
  newTag: sha-58fc018
patches:
- patch: "- op: replace\n  path: /spec/replicas\n  value: 2  "
  target:
    kind: Deployment
    name: api
generators:
  - secret-generator.yaml
