apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mycloud-qa
resources:
- ../../base
components:
- ../../components/network-policy
labels:
- pairs:
    env: qa
images:
- name: mycloud-api
  newName: ghcr.io/moheddine-belhaj/mycloud-api
  newTag: sha-a318cfd
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: cloud-qa.mohedine.dev
  target:
    kind: Ingress
    name: api
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: cloud-qa.mohedine.dev
    - op: replace
      path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
      value: mycloud-qa-ratelimit@kubernetescrd,mycloud-qa-strip-identity@kubernetescrd,mycloud-qa-forwardauth@kubernetescrd
  target:
    kind: Ingress
    name: api-protected
