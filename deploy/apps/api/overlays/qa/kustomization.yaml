apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mycloud-qa
resources:
- ../../base
labels:
- pairs:
    env: qa
images:
- name: mycloud-api
  newName: ghcr.io/moheddine-belhaj/mycloud-api
  newTag: sha-fe8b3cc
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: cloud-qa.mohedine.dev
  target:
    kind: Ingress
    name: api
