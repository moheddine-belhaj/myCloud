apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web   # cloudflared talks plain HTTP inside the cluster
spec:
  ingressClassName: traefik
  rules:
    - host: cloud.mohedine.dev            # prod default; dev/qa override below
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http