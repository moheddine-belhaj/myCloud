# sqlc turns the SQL in internal/*/queries into type-safe Go.
# Regenerate after changing a query or a migration:
#   docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:1.31.1 generate
version: "2"
sql:
  - engine: postgresql
    schema: internal/auth/migrations     # goose files: sqlc reads the "Up" parts
    queries: internal/auth/queries
    gen:
      go:
        package: store
        out: internal/auth/store
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true