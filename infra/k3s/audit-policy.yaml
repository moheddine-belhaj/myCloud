# k3s API server audit policy (cp1).
# Rules are checked top to bottom; the first match decides the level.
# Secret values are never logged: only Metadata (who, what, when, from where).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived # log each request once, when it completes
rules:
  # 1. Noise with no security value.
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/version", "/openapi*", "/metrics"]
  - level: None
    resources:
      - group: "coordination.k8s.io"
        resources: ["leases"]
      - group: ""
        resources: ["events"]
      - group: "events.k8s.io"
        resources: ["events"]

  # 2. Secrets and credentials: every read and write, metadata only.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]

  # 3. Getting into a running pod: exec, attach, port-forward, logs.
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/log"]

  # 4. Other reads: high volume, low value.
  - level: None
    verbs: ["get", "list", "watch"]

  # 5. Every change (create, update, patch, delete) to anything else.
  - level: Metadata