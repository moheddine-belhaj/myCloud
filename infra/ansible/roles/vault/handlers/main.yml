- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# A restart SEALS Vault: after it you must unseal again. Only config changes trigger it.
- name: Restart vault
  ansible.builtin.systemd_service:
    name: vault
    state: restarted

# A reload (SIGHUP) keeps Vault unsealed: it re-reads the TLS certificate and reopens log files.
- name: Reload vault
  ansible.builtin.systemd_service:
    name: vault
    state: reloaded