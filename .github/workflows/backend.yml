name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]          # no paths filter: required checks must always report

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mycloud

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::run gofmt -w on: $unformatted"; exit 1; fi
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generated code is up to date
        run: sqlc diff
      - run: go vet ./...
      - run: go test -race ./...

  validate-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: No plain Secrets in Git
        # Secret values live in Vault; Git only holds ExternalSecrets.
        # (ExternalSecret / ClusterSecretStore don't match: the line must be exactly "kind: Secret".)
        run: |
          set -euo pipefail
          if grep -rlE --include='*.yaml' --include='*.yml' '^kind:[[:space:]]*Secret[[:space:]]*$' deploy; then
            echo "::error::plain kind: Secret found in deploy/ (files above). Put the value in Vault and add an ExternalSecret."
            exit 1
          fi
      - name: Render and validate Kustomize apps and platform
        run: |
          set -euo pipefail
          for d in deploy/apps/*/overlays/*/ deploy/platform/*/; do
            echo "::group::$d"
            out=$(kustomize build "$d")
            # also catches Secrets made by a secretGenerator, which the grep above can't see
            if grep -qE '^kind:[[:space:]]*Secret[[:space:]]*$' <<<"$out"; then
              echo "::error::$d renders a kind: Secret"; exit 1
            fi
            kubeconform -strict -summary -ignore-missing-schemas - <<<"$out"
            echo "::endgroup::"
          done
      - name: Lint, render and validate Helm services
        run: |
          set -euo pipefail
          for d in deploy/services/*/*/; do
            svc=$(basename "$(dirname "$d")"); env=$(basename "$d")
            echo "::group::$svc/$env"
            args=(-f "deploy/services/$svc/values.yaml" -f "${d}values.yaml")
            helm lint deploy/charts/service "${args[@]}"
            helm template "$svc" deploy/charts/service -n "mycloud-$env" "${args[@]}" \
              | kubeconform -strict -summary -
            echo "::endgroup::"
          done

  build:
    needs: [test, validate-manifests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, auth]      # one entry per folder in backend/cmd
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            SERVICE=${{ matrix.service }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    concurrency: gitops-write
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Bump image tags in dev (Kustomize + Helm services)
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          # Kustomize services: only overlays that reference a mycloud-<svc> image
          for k in deploy/apps/*/overlays/dev/kustomization.yaml; do
            svc=$(echo "$k" | cut -d/ -f3)
            if yq -e "(.images // [])[] | select(.name == \"mycloud-$svc\")" "$k" >/dev/null 2>&1; then
              (cd "$(dirname "$k")" && kustomize edit set image "mycloud-$svc=$IMAGE_PREFIX-$svc:$tag")
            fi
          done
          # Helm services
          for v in deploy/services/*/dev/values.yaml; do
            yq -i ".image.tag = \"$tag\"" "$v"
          done
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/apps/*/overlays/dev deploy/services/*/dev
          git commit -m "deploy(dev): sha-${GITHUB_SHA::7} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main